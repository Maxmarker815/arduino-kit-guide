<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Arduino Learning — инструкция к набору</title>
<meta name="description" content="Инструкция к набору Arduino Learning: 17 проектов от мигающего светодиода до шагового мотора, с объяснениями для полных новичков.">
<meta name="robots" content="noindex, nofollow">
<!-- Авторские права © 2025 Maxmarker. Все права защищены. Коммерческое использование запрещено без письменного разрешения. -->
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Каркас. Всё оформление — в theme.css, здесь только то, без чего
   страница развалится ещё до его загрузки. */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#F6F8FC;color:#16233D;font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600}
p{margin:0 0 .6em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:#1D4ED8}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.topbar{position:sticky;top:0;z-index:50;background:#040057}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:26px;line-height:1}
.spacer{flex:1}
.btn{border:1.5px solid #CBD6E6;background:#fff;color:#16233D;padding:8px 16px;border-radius:8px;font-weight:500}
.btn.sm{padding:5px 11px;font-size:13.5px}
.bar{height:9px;background:#EDF2F9;border:1px solid #CBD6E6;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:#17A46B;border-radius:20px}
.hero{border-radius:16px;background:#040057;color:#fff;padding:24px;margin-top:24px;display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.hero .big{font-size:56px;line-height:.95;font-weight:700}
.hero .grow{flex:1;min-width:240px}
.hero-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.hero-acts .btn{text-decoration:none}
.section-head{display:flex;align-items:baseline;gap:14px;margin:40px 0 14px}
.section-head h2{font-size:31px;line-height:1}
.section-head .sub{font-size:13.5px;color:#74839E}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;align-items:start}
.pcard{border:1.5px solid #CBD6E6;background:#fff;border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.pcard .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:#74839E}
.pcard h3{font-size:22px;line-height:1.1}
.mark{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;border:1.5px solid #CBD6E6;background:#fff;color:#44567A;font-weight:500}
.mark .box{width:18px;height:18px;flex:none;border:1.5px solid #CBD6E6;border-radius:3px;display:grid;place-items:center;font-size:12px;line-height:1}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;border:1.5px solid #CBD6E6;color:#74839E}
.muted{color:#74839E}
a.btn{text-decoration:none;display:inline-block;text-align:center}
</style>
<link rel="stylesheet" href="theme.css?v=1789579075">
<link rel="stylesheet" href="site.css?v=1789579075">
</head>
<body>

<a class="skiplink" href="#app">Перейти к содержимому</a>

<div class="topbar"><div class="topbar-in">
  <a class="brand" href="index.html" aria-label="Arduino Learning — на главную">
    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round">
        <rect x="26" y="34" width="48" height="34" rx="5"/>
        <line x1="36" y1="34" x2="36" y2="23"/><line x1="50" y1="34" x2="50" y2="23"/><line x1="64" y1="34" x2="64" y2="23"/>
        <line x1="36" y1="68" x2="36" y2="79"/><line x1="50" y1="68" x2="50" y2="79"/><line x1="64" y1="68" x2="64" y2="79"/>
      </g>
    </svg>
    <span class="brand-txt"><b>Arduino</b><span class="brand-rest"> Learning</span></span>
  </a>
  <div class="spacer"></div>
  <a class="btn ghost sm" id="helplink" href="help.html">Помощь</a>
</div></div>

<div class="wrap" id="app" tabindex="-1"></div>

<script src="kit.js?v=1789579075"></script>
<script>
/* =====================================================================
   ГЛАВНАЯ СТРАНИЦА
   Один экран: сколько собрано, что дальше, разделы для начала и сетка
   из семнадцати проектов. Никаких кабинетов и никакого входа — сайт
   открывается сразу, отметки лежат в браузере покупателя.
   ===================================================================== */
(function(){
 try {
  Progress.load();

  const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  document.getElementById('helplink').href = KIT.HELP_URL;

  let flash = null;

  function render(){
    const app = document.getElementById('app');
    /* Страница перерисовывается целиком, поэтому запоминаем, где человек
       стоял: иначе после нажатия «Собрал» его выбрасывает наверх списка. */
    const keepY = window.scrollY;
    app.innerHTML = '';
    /* Кто ещё ничего не собрал, видит не прогресс, а первый шаг: прогресс
       «0 / 17» ничего ему не сообщает, а вот «с чего начать» — сообщает. */
    app.appendChild(Progress.doneCount() === 0 ? startBlock() : hero());
    app.appendChild(projectsBlock());
    app.appendChild(partsBlock());
    app.appendChild(footNote());
    window.scrollTo(0, keepY);
    if (flash){
      const el = app.querySelector('[data-proj="' + flash + '"]');
      if (el){ el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1100); }
      flash = null;
    }
  }

  /* --------------------------- первый экран ----------------------------
     Человек только что вскрыл коробку. В школе ему бы сказали, что делать;
     здесь он один, поэтому первый экран — это не статистика, а три шага и
     одна кнопка. Ровно три: меньше — непонятно, больше — уже список дел.  */
  function startBlock(){
    const first = projOf(1);
    const el = $(`<div class="hero start">
      <div class="grow">
        <div class="ht">Коробка в руках — с чего начать</div>
        <ol class="steps">
          <li><b>Разложи детали</b><span>Что есть в наборе и как называется — 10 минут</span></li>
          <li><b>Поставь программу на компьютер</b><span>Arduino IDE, подключение платы — 20 минут</span></li>
          <li><b>Собери первый проект</b><span>${esc(first.t)} — ${first.m} минут, и оно замигает</span></li>
        </ol>
        <div class="hero-acts">
          <a class="btn primary" href="${KIT.COURSE_URL}#part-2">Поставить программу</a>
          <a class="btn" href="${KIT.COURSE_URL}#part-1">Сначала посмотреть набор</a>
        </div>
        <p class="muted small">Весь курс — 17 проектов, примерно ${humanTime(Progress.minutesLeft())}. Паяльник понадобится один раз: в Проекте 06 к экрану нужно припаять гребёнку.</p>
      </div>
      <div class="hero-photo" style="background-image:url('assets/${PHOTO[1]}')"></div>
    </div>`);
    return el;
  }

  /* --------------------- верхний блок для вернувшегося ------------------- */
  function hero(){
    const done = Progress.doneCount();
    const pct  = Math.round(done / NPROJ * 100);
    const cur  = projOf(Progress.firstOpen());
    const title = pct < 50 ? 'Хорошо идёшь'
                : pct < 100 ? 'Больше половины позади' : 'Весь курс пройден!';

    const el = $(`<div class="hero">
      <div class="big">${done}<small> / ${NPROJ}</small>
        <div class="cap">проектов собрано</div></div>
      <div class="grow">
        <div class="ht">${title}</div>
        <p class="muted">${cur
          ? 'Следующий по программе — <b>Проект ' + two(cur.n) + ' · ' + esc(cur.t) + '</b>. На всё оставшееся — примерно ' + humanTime(Progress.minutesLeft())
          : 'Все семнадцать проектов собраны. Что собрать дальше из этого же набора — в разделе «Дальше и поддержка».'}</p>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
    </div>`);

    if (cur){
      el.appendChild($(`<div class="hero-photo" style="background-image:url('assets/${PHOTO[cur.n]}')"></div>`));
      const acts = $(`<div class="hero-acts"></div>`);
      acts.appendChild($(`<a class="btn" href="${KIT.COURSE_URL}#proj-${cur.n}">Открыть урок</a>`));
      const m = $(`<button class="mark"><span class="box"></span>Собрал</button>`);
      m.onclick = () => {
        Progress.set(cur.n, true);
        flash = cur.n;
        const nx = projOf(Progress.firstOpen());
        kitToast(nx ? 'Проект ' + two(cur.n) + ' собран. Дальше — ' + nx.t
                    : 'Проект ' + two(cur.n) + ' собран. Весь курс пройден!');
        render();
      };
      acts.appendChild(m);
      el.querySelector('.grow').appendChild(acts);
    }
    return el;
  }

  /* --------------------- справочные разделы (внизу) ----------------------
     Раньше они стояли над проектами и отвечали на вопрос, которого у
     человека ещё нет. Теперь это справочник: сюда возвращаются, когда
     что-то забыл, — значит место внизу.                                   */
  function partsBlock(){
    const box = document.createElement('div');
    box.appendChild($(`<div class="section-head"><h2>Справочник</h2>
      <span class="sub">Сюда возвращаются, когда что-то забыл</span></div>`));
    const row = $(`<div class="pre-row"></div>`);
    PARTS.forEach((p, i) => {
      row.appendChild($(`<a class="pre-card" href="${KIT.COURSE_URL}#${p.k}">
        <span class="pre-n">${two(i + 1)}</span>
        <span class="pre-t"><b>${esc(p.t)}</b><span>${esc(p.s)}</span></span>
      </a>`));
    });
    row.appendChild($(`<a class="pre-card help" href="${KIT.HELP_URL}">
      <span class="pre-n">!</span>
      <span class="pre-t"><b>Если совсем не идёт</b><span>Плата не определяется, код не заливается, ничего не горит</span></span>
    </a>`));
    box.appendChild(row);
    return box;
  }

  /* ---------------------------- сетка проектов ---------------------------
     Три ступени вместо сплошной ленты: человек сразу видит, что первые пять
     — это вечер на всё, а последние семь — по вечеру на каждый.            */
  function projectsBlock(){
    const box = document.createElement('div');
    const done = Progress.doneCount();
    box.appendChild($(`<div class="section-head"><h2>Семнадцать проектов</h2>
      <span class="sub">${done ? 'Собрано ' + done + ' из ' + NPROJ + ' · порядок свободный'
                               : 'Порядок свободный — но по возрастанию сложности идти проще'}</span></div>`));

    const openNow = Progress.firstOpen();

    GROUPS.forEach(g => {
      const inGroup = PROJECTS.filter(p => p.n >= g.from && p.n <= g.to);
      const gDone = inGroup.filter(p => Progress.isDone(p.n)).length;
      box.appendChild($(`<div class="grp-head">
        <b>${esc(g.t)}</b>
        <span class="gs">${esc(g.s)}</span>
        <span class="gc">${gDone === inGroup.length ? 'собрано всё' : gDone + ' из ' + inGroup.length}</span>
      </div>`));

      const grid = $(`<div class="proj-grid"></div>`);
      box.appendChild(grid);

      inGroup.forEach(p => {
      const isDone = Progress.isDone(p.n);
      const st = isDone ? 'done' : (p.n === openNow ? 'doing' : 'todo');

      const c = $(`<div class="pcard ${st}" data-proj="${p.n}">
        <div class="pthumb">${isDone ? '<span class="medal" aria-hidden="true">✓</span>' : ''}<img loading="lazy" src="assets/${PHOTO[p.n]}" alt="${esc(p.t)}"></div>
        <div class="num">${two(p.n)} · ${stars(p.s)} · ${p.m} мин</div>
        <h3>${esc(p.t)}</h3>
        ${st === 'doing' ? '<div><span class="chip doing">Следующий</span></div>' : ''}
      </div>`);

      const acts = $(`<div class="acts"></div>`);

      /* Кнопка-переключатель: она же показывает состояние, она же его меняет.
         Пустой квадратик — ещё не собрано, зелёная галочка — собрано. */
      const mark = $(`<button class="mark ${isDone ? 'on' : ''}" title="${isDone ? 'Нажми, если отметил по ошибке' : 'Нажми, когда проект заработает'}">
        <span class="box">${isDone ? '✓' : ''}</span>Собрал</button>`);
      mark.onclick = (e) => {
        e.stopPropagation();
        Progress.set(p.n, !isDone);
        flash = p.n;
        if (!isDone){
          const nx = projOf(Progress.firstOpen());
          kitToast(nx ? 'Проект ' + two(p.n) + ' собран. Дальше — ' + nx.t
                      : 'Проект ' + two(p.n) + ' собран. Весь курс пройден!');
        } else {
          kitToast('Отметка снята с проекта ' + two(p.n));
        }
        render();
      };
      acts.appendChild(mark);

      const help = $(`<button class="btn ghost tiny">Не получается</button>`);
      help.onclick = (e) => { e.stopPropagation(); askHelp(p.n); };
      acts.appendChild(help);
      c.appendChild(acts);

      /* Карточка целиком открывает урок: и мышью, и с клавиатуры. */
      const open = () => { location.href = KIT.COURSE_URL + '#proj-' + p.n; };
      c.classList.add('clickable');
      c.setAttribute('role', 'link');
      c.setAttribute('tabindex', '0');
      c.setAttribute('aria-label', 'Открыть урок: проект ' + p.n + ', ' + p.t);
      c.onclick = open;
      c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } };

        grid.appendChild(c);
      });
    });
    return box;
  }

  /* ------------------------------- подвал -------------------------------- */
  function footNote(){
    return $(`<div class="foot-note">
      <p>Что-то не собирается — пиши в <a href="${KIT.TELEGRAM}" target="_blank" rel="noopener">Telegram-группу набора</a>.</p>
      <p class="cr">Arduino Learning · инструкция v1.0 · © 2025 Maxmarker</p>
    </div>`);
  }

  render();

  /* Отметку могли поставить в другой вкладке — на уроке. Возвращаясь сюда,
     человек должен увидеть свежие галочки, а не те, что были до перехода. */
  window.addEventListener('storage', (e) => {
    if (!e.key || e.key === Progress.KEY){ Progress.load(); render(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){ Progress.load(); render(); }
  });

 } catch(err){
  /* Страховка: что бы ни случилось, ссылки на уроки должны остаться. */
  document.getElementById('app').innerHTML =
    '<div class="empty"><div class="t">Страница не загрузилась целиком</div>' +
    '<div class="s">Открой <a href="course.html">уроки</a> напрямую или обнови страницу.</div></div>';
  console.error('index:', err);
 }
})();
</script>
</body>
</html>
